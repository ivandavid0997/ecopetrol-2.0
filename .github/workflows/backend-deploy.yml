name: Deploy Backend - Spring Boot (ACI · entorno 2)

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrecopetrolntt2.azurecr.io
  IMAGE_NAME: talento-back
  ACI_NAME: aci-centralecopetrol2
  ACI_RG: rg-central-solucion-talento2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x back/talento/gradlew

      - name: Build JAR
        working-directory: back/talento
        run: ./gradlew clean bootJar --no-daemon

      - name: Log in to ACR (entorno 2)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR2_USERNAME }}
          password: ${{ secrets.ACR2_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: back/talento
          file: back/talento/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        if: env.HAS_AZURE_CREDS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ACI no permite agregar/cambiar env vars "in-place" ni `az container restart`
      # baja de forma fiable una imagen nueva (reinicia el mismo digest). Por eso se
      # recrea el contenedor apuntando al tag del commit (:${sha}) e inyectando TODOS
      # los secretos. Conservar el dns-name-label preserva el FQDN
      # (talento-eco2.centralus.azurecontainer.io) aunque cambie la IP pública.
      #
      # Requiere estos GitHub Secrets en el repo (Settings > Secrets and variables > Actions):
      #   JWT_SECRET, AES_SECRET_KEY, AES_INIT_VECTOR, NOMINA_API_KEY,
      #   NOMINA_API_URL, ECOPETROL_DB2_PASSWORD  (+ los ya existentes
      #   ACR2_USERNAME, ACR2_PASSWORD, AZURE_CREDENTIALS).
      # JWT_EXPIRATION_MS es opcional (el código tiene default 21600000).
      - name: Redeploy ACI (entorno 2) con env vars
        if: env.HAS_AZURE_CREDS == 'true'
        uses: azure/cli@v2
        env:
          ACR2_USERNAME: ${{ secrets.ACR2_USERNAME }}
          ACR2_PASSWORD: ${{ secrets.ACR2_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          AES_INIT_VECTOR: ${{ secrets.AES_INIT_VECTOR }}
          NOMINA_API_URL: ${{ secrets.NOMINA_API_URL }}
          NOMINA_API_KEY: ${{ secrets.NOMINA_API_KEY }}
          ECOPETROL_DB2_PASSWORD: ${{ secrets.ECOPETROL_DB2_PASSWORD }}
        with:
          azcliversion: latest
          inlineScript: |
            set -e

            # 1) Validar que los secretos OBLIGATORIOS existen ANTES de borrar el
            #    contenedor (delete+create implica downtime: si create fallara por un
            #    secret faltante, el servicio quedaría caído). Abortamos sin tocar nada.
            missing=""
            for v in JWT_SECRET AES_SECRET_KEY AES_INIT_VECTOR NOMINA_API_KEY NOMINA_API_URL ECOPETROL_DB2_PASSWORD ACR2_USERNAME ACR2_PASSWORD; do
              if [ -z "${!v}" ]; then missing="$missing $v"; fi
            done
            if [ -n "$missing" ]; then
              echo "::error title=Faltan GitHub Secrets::Define estos secrets en el repo antes de desplegar:$missing. ACI NO modificado."
              exit 1
            fi
            JWT_EXPIRATION_MS="${JWT_EXPIRATION_MS:-21600000}"
            IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

            echo "Borrando ACI actual (entorno 2)..."
            az container delete -n "$ACI_NAME" -g "$ACI_RG" --yes

            echo "Creando ACI con imagen $IMAGE e inyectando env vars..."
            az container create -g "$ACI_RG" -n "$ACI_NAME" \
              --image "$IMAGE" \
              --os-type Linux \
              --cpu 1 --memory 2 \
              --ports 8080 \
              --ip-address Public \
              --dns-name-label talento-eco2 \
              --location centralus \
              --restart-policy OnFailure \
              --registry-login-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR2_USERNAME" \
              --registry-password "$ACR2_PASSWORD" \
              --environment-variables \
                SPRING_PROFILES_ACTIVE=azure2 \
                JWT_EXPIRATION_MS="$JWT_EXPIRATION_MS" \
                NOMINA_API_URL="$NOMINA_API_URL" \
              --secure-environment-variables \
                JWT_SECRET="$JWT_SECRET" \
                AES_SECRET_KEY="$AES_SECRET_KEY" \
                AES_INIT_VECTOR="$AES_INIT_VECTOR" \
                NOMINA_API_KEY="$NOMINA_API_KEY" \
                ECOPETROL_DB2_PASSWORD="$ECOPETROL_DB2_PASSWORD"

            echo "Estado final del ACI:"
            az container show -n "$ACI_NAME" -g "$ACI_RG" \
              --query "{state:instanceView.state, ip:ipAddress.ip, fqdn:ipAddress.fqdn, image:containers[0].image}" -o json

      - name: Notice — Azure redeploy skipped
        if: env.HAS_AZURE_CREDS != 'true'
        run: |
          echo "::warning title=Redeploy skipped::Imagen subida a ACR2 pero el ACI no se recreó: falta el secret AZURE_CREDENTIALS. Agrégalo para habilitar el auto-redeploy."
