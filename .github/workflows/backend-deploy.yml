name: Deploy Backend - Spring Boot (ACI · entorno 2)

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrecopetrolntt2.azurecr.io
  IMAGE_NAME: talento-back
  ACI_NAME: aci-centralecopetrol2
  ACI_RG: rg-central-solucion-talento2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x back/talento/gradlew

      - name: Build JAR
        working-directory: back/talento
        run: ./gradlew clean bootJar --no-daemon

      - name: Log in to ACR (entorno 2)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR2_USERNAME }}
          password: ${{ secrets.ACR2_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: back/talento
          file: back/talento/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        if: env.HAS_AZURE_CREDS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------------------------------------------
      # Variables de configuración del backend (JWT / AES / API Nómina)
      # ---------------------------------------------------------------
      # La app las lee como variables de entorno; los valores por defecto
      # están embebidos en la imagen (application.properties), así que el
      # contenedor funciona sin setearlas aquí:
      #   JWT_SECRET, JWT_EXPIRATION_MS,
      #   AES_SECRET_KEY, AES_INIT_VECTOR,
      #   NOMINA_API_URL, NOMINA_API_KEY
      #
      # `az container restart` NO inyecta env nuevas y CONSERVA el env seguro
      # ya existente del ACI2 (ECOPETROL_DB2_PASSWORD). Para rotar/override
      # alguna de estas SIN perder ese secreto hay que RECREAR el contenedor
      # pasando TODA la env segura (incluida la clave de BD), p.ej.:
      #
      #   az container create -g "$ACI_RG" -n "$ACI_NAME" \
      #     --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
      #     --secure-environment-variables \
      #       ECOPETROL_DB2_PASSWORD="<secret>" \
      #       JWT_SECRET="<secret>" JWT_EXPIRATION_MS="21600000" \
      #       AES_SECRET_KEY="<secret>" AES_INIT_VECTOR="<secret>" \
      #       NOMINA_API_URL="<url>" NOMINA_API_KEY="<secret>"
      - name: Restart ACI to pick up new image
        if: env.HAS_AZURE_CREDS == 'true'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container restart --name "${ACI_NAME}" --resource-group "${ACI_RG}"
            echo "ACI ${ACI_NAME} reiniciado — ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest (commit ${{ github.sha }})"

      - name: Notice — Azure redeploy skipped
        if: env.HAS_AZURE_CREDS != 'true'
        run: |
          echo "::warning title=Redeploy skipped::Imagen subida a ACR2 pero el ACI no se reinició: falta el secret AZURE_CREDENTIALS. Agrégalo para habilitar el auto-redeploy."
